[project]
name = "manufacturing-ai-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Keithway123", email = "keithsway802@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "langgraph>=1.2.9",
    "llama-index>=0.14.23",
    "llama-index-embeddings-dashscope>=0.5.0",
    "llama-index-vector-stores-qdrant>=0.10.2",
    "openai>=2.44.0",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
    "qdrant-client==1.18.0",
    "uvicorn[standard]>=0.50.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
