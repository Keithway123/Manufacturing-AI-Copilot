services:
  manufacturing-api:
    build: .
    image: manufacturing-ai-copilot-api:v0.1
    container_name: manufacturing-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: manufacturing_knowledge
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    
    ports:
      - "8001:8000"

  postgres:
    image: postgres:16-alpine
    container_name: manufacturing-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      # 数据写入 named volume，删除容器后仍能保留。
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # pg_isready 检查 PostgreSQL 是否能够接受连接。
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # 固定版本，避免latest升级后出现不可预测变化。
    image: qdrant/qdrant:v1.18.2
    container_name: manufacturing-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage
    
    healthcheck:
      # 这里只检查Qdrant是否监听6333端口。
      test: ["CMD-SHELL","bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant-hybrid:
    # 独立验证 Qdrant 1.19 的中文 BM25，不影响现有 Dense Collection。
    image: qdrant/qdrant:v1.19.1
    container_name: manufacturing-qdrant-hybrid

    ports:
      - "6335:6333"

    volumes:
      - qdrant_hybrid_data:/qdrant/storage

    healthcheck:
      test: ["CMD-SHELL","bash -c ':> /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  # 顶层声明 named volume，供postgres服务引用。
  postgres_data:
  # Qdrant的collection和points由Docker持久化管理。
  qdrant_data:
  # Hybrid实验使用独立数据卷，避免修改已验证的Dense基线。
  qdrant_hybrid_data:
